packages:
  - clients/*
  - services/*
  - runtime/local-execution
  - runtime/local-service
  - runtime/adapters/core
  - runtime/adapters/antigravity
  - runtime/adapters/claude-code
  - runtime/adapters/codex
  - runtime/adapters/cursor
  - runtime/adapters/grok-build
  - runtime/adapters/grok-bot
  - runtime/adapters/openclaw
  - runtime/adapters/opencode
  - packages/*
  - tooling/*
  - scripts/release

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  better-sqlite3: true
  core-js-pure: false
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  lightningcss: true
  msw: false
  node-liblzma: false
  protobufjs: false
  sharp: true
  workerd: true

catalog:
  '@cloudflare/workers-types': 5.20261001.1
  wrangler: 4.147.0
  zod: 4.6.6

minimumReleaseAgeExclude:
  - miniflare

overrides:
  '@cloudflare/computer>capnweb': 0.12.0
  '@aws-sdk/core': 3.974.28
  '@aws-sdk/credential-provider-env': 3.972.54
  '@aws-sdk/credential-provider-http': 3.972.56
  '@aws-sdk/credential-provider-ini': 3.972.61
  '@aws-sdk/credential-provider-login': 3.972.60
  '@aws-sdk/credential-provider-node': 3.972.63
  '@aws-sdk/credential-provider-process': 3.972.54
  '@aws-sdk/credential-provider-sso': 3.972.60
  '@aws-sdk/credential-provider-web-identity': 3.972.60
  '@aws-sdk/middleware-websocket': 3.972.36
  '@aws-sdk/nested-clients': 3.997.28
  '@aws-sdk/token-providers': 3.1080.0
  # Paired with the Zep ontology patch below; keep its runtime and types on Zod 4.
  '@getzep/zep-cloud@3.30.0>zod': 'catalog:'
  '@modelcontextprotocol/sdk>zod': 'catalog:'
  # Miniflare pins earlier Undici 7 versions affected by HTTP and TLS advisories.
  'miniflare>undici@>=7.29.0 <7.30.1': 7.30.1
  'rolldown@<1.2.0': 1.1.4
  'rolldown@1.0.0-rc.3': 1.1.4
  # Miniflare 5 pins vulnerable sharp 0.35.x patches; lift them to the fix.
  'sharp@>=0.35.0 <0.35.5': 0.35.5
  'ws@>=8.0.0 <8.21.0': 8.21.3
  wrangler: 'catalog:'
  'zod@>=4.0.0 <4.6.6': 'catalog:'

packageExtensions:
  # Flue's generated Worker still uses Agents 0.20.1. Keep its exact MCP peers
  # separate from the direct Agents 0.28.1 browser integration.
  '@flue/vite@2.3.0':
    dependencies:
      '@modelcontextprotocol/client': 2.0.0
      '@modelcontextprotocol/server': 2.0.0
      '@modelcontextprotocol/sdk': 1.30.0
  '@lobehub/icons@5.0.1':
    dependencies:
      es-toolkit: 1.46.0

patchedDependencies:
  '@getzep/zep-cloud@3.30.0': patches/@getzep__zep-cloud@3.30.0.patch
  capnweb@0.12.0: services/remote-agent/computerd/capnweb-0.12.0.patch
  '@cloudflare/vitest-plugin@1.3.6': patches/@cloudflare__vitest-plugin@1.3.6.patch
  '@better-auth/electron@1.7.7': patches/@better-auth__electron@1.7.7.patch
  '@cloudflare/computer@0.5.0': patches/@cloudflare__computer@0.5.0.patch
  '@flue/runtime@2.3.0': patches/@flue__runtime@2.3.0.patch
  '@tailwindcss/vite@4.2.1': patches/@tailwindcss__vite.patch
  '@tanstack/start-plugin-core@1.171.53': patches/@tanstack__start-plugin-core.patch
  better-sqlite3@13.0.3: patches/better-sqlite3@13.0.3.patch
  img-fx@0.5.1: patches/img-fx@0.5.1.patch
  slate-react@0.126.4: patches/slate-react@0.126.4.patch
  thinking-orbs@0.3.1: patches/thinking-orbs@0.3.1.patch
