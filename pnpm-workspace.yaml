  '@mongodb-js/zstd': false
  better-sqlite3: true
  core-js-pure: false
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  lightningcss: true
  msw: false
  node-liblzma: false
  protobufjs: false
  sharp: true
  workerd: true

