packages:
  - clients/*
  - services/*
  - runtime/local-execution
  - runtime/local-service
  - runtime/adapters/core
  - runtime/adapters/claude-code
  - runtime/adapters/codex
  - runtime/adapters/cursor
  - runtime/adapters/grok-build
  - runtime/adapters/openclaw
  - runtime/adapters/opencode
  - packages/*
  - tooling/*

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  better-sqlite3: true
  core-js-pure: false
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  lightningcss: true
  msw: false
  node-liblzma: false
  protobufjs: false
  sharp: true
  workerd: true

catalog:
  '@cloudflare/workers-types': 5.20260908.1
  wrangler: 4.130.0
  zod: 4.6.5

minimumReleaseAgeExclude:
  - miniflare

overrides:
  # Force every @modelcontextprotocol/sdk instance onto the workspace's zod
  # catalog version. Without this, pnpm can resolve a second, older zod for
  # the SDK's own peer dependency (e.g. pulled in transitively through
  # @anthropic-ai/claude-agent-sdk) while callers like the CLI's dispatch MCP
  # server build tool schemas with the catalog zod. Two zod instances make
  # every zod-schema `instanceof` check the SDK does at runtime fail, which
  # surfaces as `McpError: MCP error -32603: Cannot read properties of
  # undefined (reading 'push')` on the very first tool call.
  '@modelcontextprotocol/sdk>zod': 'catalog:'
  '@aws-sdk/core': 3.974.28
  '@aws-sdk/credential-provider-env': 3.972.54
  '@aws-sdk/credential-provider-http': 3.972.56
  '@aws-sdk/credential-provider-ini': 3.972.61
  '@aws-sdk/credential-provider-login': 3.972.60
  '@aws-sdk/credential-provider-node': 3.972.63
  '@aws-sdk/credential-provider-process': 3.972.54
  '@aws-sdk/credential-provider-sso': 3.972.60
  '@aws-sdk/credential-provider-web-identity': 3.972.60
  '@aws-sdk/middleware-websocket': 3.972.36
  '@aws-sdk/nested-clients': 3.997.28
  '@aws-sdk/token-providers': 3.1080.0
  rolldown: 1.1.4
  wrangler: 'catalog:'

packageExtensions:
  '@lobehub/icons@5.0.1':
    dependencies:
      es-toolkit: 1.46.0

patchedDependencies:
  '@better-auth/electron@1.6.30': patches/@better-auth__electron@1.6.30.patch
  '@cloudflare/computer@0.2.1': patches/@cloudflare__computer@0.2.1.patch
  '@flue/runtime@2.0.3': patches/@flue__runtime@2.0.3.patch
  '@tanstack/history@1.162.1': patches/@tanstack__history@1.162.1.patch
  better-sqlite3@13.0.3: patches/better-sqlite3@13.0.3.patch
  img-fx@0.5.1: patches/img-fx@0.5.1.patch
  thinking-orbs@0.3.1: patches/thinking-orbs@0.3.1.patch
