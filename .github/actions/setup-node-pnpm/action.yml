name: Setup Node.js and pnpm
description: Install the repository-pinned Node.js and pnpm toolchain with the shared pnpm store cache.

inputs:
  dependency_mode:
    description: workspace builds apps; renderer-promotion installs trusted tools; release-tools builds publication schemas without app dependencies
    required: false
    default: workspace
  node_version:
    description: Node version; admission consumers use their parent's exact version
    required: false
    default: "24"
  control_directory:
    description: Optional trusted control checkout for schema and release parser dependencies
    required: false
    default: ""
  working_directory:
    description: Repository checkout whose lockfile and dependencies are authoritative
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10.30.0
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node_version }}
        cache: ${{ inputs.dependency_mode == 'workspace' && 'pnpm' || '' }}
        package-manager-cache: ${{ inputs.dependency_mode == 'workspace' }}
        cache-dependency-path: ${{ inputs.working_directory }}/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      env:
        SETUP_CONTROL_DIRECTORY: ${{ inputs.control_directory }}
        SETUP_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        SETUP_DEPENDENCY_MODE: ${{ inputs.dependency_mode }}
      run: |
        set -euo pipefail
        if [ "$SETUP_DEPENDENCY_MODE" = renderer-promotion ]; then
          test -n "$SETUP_CONTROL_DIRECTORY" || { echo 'Promotion requires a trusted control checkout.' >&2; exit 1; }
          pnpm --dir "$SETUP_CONTROL_DIRECTORY" install \
            --frozen-lockfile \
            --filter @openmeld/release-tools... \
            --prod \
            --ignore-scripts
          echo "$(cd "$SETUP_CONTROL_DIRECTORY/scripts/release" && pwd)/node_modules/.bin" >> "$GITHUB_PATH"
        elif [ "$SETUP_DEPENDENCY_MODE" = release-tools ]; then
          pnpm --dir "$SETUP_WORKING_DIRECTORY" install \
            --frozen-lockfile \
            --filter @openmeld/release-tools... \
            --prod=false \
            --ignore-scripts
          echo "$(cd "$SETUP_WORKING_DIRECTORY/scripts/release" && pwd)/node_modules/.bin" >> "$GITHUB_PATH"
        elif [ "$SETUP_DEPENDENCY_MODE" = workspace ]; then
          pnpm --dir "$SETUP_WORKING_DIRECTORY" install --frozen-lockfile
          if [ -n "$SETUP_CONTROL_DIRECTORY" ]; then
          pnpm --dir "$SETUP_CONTROL_DIRECTORY" install \
            --frozen-lockfile \
            --filter @openmeld/root \
            --filter @openmeld/schemas \
            --prod=false \
            --ignore-scripts
          fi
        else
          echo "Unknown dependency mode: $SETUP_DEPENDENCY_MODE" >&2
          exit 1
        fi
