name: Setup Fast PR planner
description: Install only Node.js and pnpm for the dependency-free Fast PR planning job.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10.30.0
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "24"
        package-manager-cache: false
