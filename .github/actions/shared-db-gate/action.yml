name: Release production database
description: Generate committed database artifacts, migrate OPENMELD_DB, verify its physical contract, and optimize planner statistics once.

inputs:
  production_train_scopes:
    description: Complete release train containing this Database stage
    required: true
  release_sha:
    description: Exact release-source commit
    required: true
  parent_admission_evidence:
    description: Same-run release-on-main admission output; omitted for standalone admission
    required: false
    default: ""
  working_directory:
    description: Exact release-source checkout
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Admit declared production train artifacts
      shell: bash
      env:
        DB_RELEASE_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        OPENMELD_PRODUCTION_TRAIN_SCOPES: ${{ inputs.production_train_scopes }}
        OPENMELD_PARENT_TRAIN_ADMISSION: ${{ inputs.parent_admission_evidence }}
        RELEASE_SHA: ${{ inputs.release_sha }}
      run: |
        set -euo pipefail
        cd "$DB_RELEASE_WORKING_DIRECTORY"
        node "$GITHUB_ACTION_PATH/../../../scripts/release/production-train-artifact-admission.mjs" \
          --source-sha "$RELEASE_SHA" \
          --scope db

    - name: Release production database
      shell: bash
      env:
        DB_RELEASE_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        OPENMELD_DB_EXECUTION_MODE: prod
        OPENMELD_PRODUCTION_TRAIN_SCOPES: ${{ inputs.production_train_scopes }}
        OPENMELD_PARENT_TRAIN_ADMISSION: ${{ inputs.parent_admission_evidence }}
        RELEASE_SHA: ${{ inputs.release_sha }}
      run: |
        set -euo pipefail
        cd "$DB_RELEASE_WORKING_DIRECTORY"
        node "$GITHUB_ACTION_PATH/../../../scripts/release/production-db.mjs"
