name: Production scope lease
description: Atomically acquires or releases one cross-machine production scope lease.

inputs:
  operation:
    description: acquire or release
    required: true
  scope:
    description: Canonical production scope
    required: true
  source_sha:
    description: Exact main source SHA for acquisition
    required: false
    default: ""
  owner:
    description: Observable release owner identity
    required: false
    default: ""
  lease_sha:
    description: Exact acquired lease SHA for atomic release
    required: false
    default: ""

outputs:
  lease_sha:
    description: Exact lease commit acquired by this action
    value: ${{ steps.lease.outputs.lease_sha }}

runs:
  using: composite
  steps:
    - name: Apply production scope lease operation
      id: lease
      shell: bash
      env:
        LEASE_OPERATION: ${{ inputs.operation }}
        LEASE_OWNER: ${{ inputs.owner }}
        LEASE_SCOPE: ${{ inputs.scope }}
        LEASE_SHA: ${{ inputs.lease_sha }}
        RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -euo pipefail
        case "$LEASE_OPERATION" in
          acquire)
            node scripts/release/production-scope-lease.mjs acquire \
              --scope "$LEASE_SCOPE" \
              --source-sha "$RELEASE_SOURCE_SHA" \
              --owner "$LEASE_OWNER" \
              --github-output "$GITHUB_OUTPUT"
            ;;
          release)
            node scripts/release/production-scope-lease.mjs release \
              --scope "$LEASE_SCOPE" \
              --lease-sha "$LEASE_SHA"
            ;;
          *)
            echo "::error::Unknown production scope lease operation: $LEASE_OPERATION"
            exit 1
            ;;
        esac
