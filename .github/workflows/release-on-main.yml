name: 🚀 Scoped Production Release
run-name: Scoped Production Release ${{ inputs.scope }} @ ${{ inputs.release_sha }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact 40-character main commit SHA approved for this release"
        required: true
        type: string
      scope:
        description: "One component by default; cloud/full are explicit fleet releases"
        required: true
        type: choice
        default: web
        options:
          - database
          - database-auth
          - database-core
          - web
          - gateway
          - auth
          - core
          - remote-agent
          - cloud
          - full

jobs:
  reject_non_main:
    name: Reject Non-Main Production Deploy
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          echo "::error::Production deploys must run from main. Current ref: ${GITHUB_REF}"
          exit 1

  validate_release_source:
    name: Validate Immutable Main Release Source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Require release SHA from main first-parent history
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! validation_error="$(node scripts/release/require-mainline-release-sha.mjs \
            "$RELEASE_SHA" refs/remotes/origin/main 2>&1)"; then
            echo "::error::$validation_error"
            exit 1
          fi

  database:
    name: Release Production Database
    needs: validate_release_source
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.scope == 'database' ||
       inputs.scope == 'database-auth' ||
       inputs.scope == 'database-core' ||
       inputs.scope == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-production-database
      cancel-in-progress: false
    environment: production
    env:
      BETTER_AUTH_OPENMELD_SECRET: ci_codegen_only_secret_please_do_not_use_1234567890
      AUTH_WORKER_NODE_ENV: development
      BETTER_AUTH_URL: http://localhost:8788
      WEB_APP_URL: http://localhost:8788
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: 15f16284-5240-4675-b626-3b7144e1d684
    steps:
      - name: Require main
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production deploys must run from main. Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          ref: ${{ inputs.release_sha }}

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Generate, migrate, verify, and optimize production database
        uses: ./.github/actions/shared-db-gate

  web:
    name: Release Web
    needs:
      - database
      - auth
      - validate_release_source
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (inputs.scope == 'web' || inputs.scope == 'cloud' || inputs.scope == 'full') &&
      needs.validate_release_source.result == 'success' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (needs.auth.result == 'success' || needs.auth.result == 'skipped')
    uses: ./.github/workflows/deploy-web.yml
    with:
      deploy_environment: production
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit

  gateway:
    name: Release Gateway Worker
    needs:
      - database
      - web
      - validate_release_source
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (inputs.scope == 'gateway' || inputs.scope == 'cloud' || inputs.scope == 'full') &&
      needs.validate_release_source.result == 'success' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped')
    uses: ./.github/workflows/deploy-gateway-worker.yml
    with:
      deploy_environment: production
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit

  auth:
    name: Release Auth Worker
    needs:
      - database
      - validate_release_source
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (inputs.scope == 'auth' ||
       inputs.scope == 'database-auth' ||
       inputs.scope == 'cloud' ||
       inputs.scope == 'full') &&
      needs.validate_release_source.result == 'success' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped')
    uses: ./.github/workflows/deploy-auth-worker.yml
    with:
      deploy_environment: production
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit

  core:
    name: Release Core Worker
    needs:
      - database
      - web
      - gateway
      - auth
      - validate_release_source
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (inputs.scope == 'core' ||
       inputs.scope == 'database-core' ||
       inputs.scope == 'cloud' ||
       inputs.scope == 'full') &&
      needs.validate_release_source.result == 'success' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      (needs.gateway.result == 'success' || needs.gateway.result == 'skipped') &&
      (needs.auth.result == 'success' || needs.auth.result == 'skipped')
    uses: ./.github/workflows/deploy-core-worker.yml
    with:
      deploy_environment: production
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit

  remote_agent:
    name: Release Remote Agent Worker
    needs:
      - database
      - web
      - gateway
      - auth
      - core
      - validate_release_source
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (inputs.scope == 'remote-agent' || inputs.scope == 'cloud' || inputs.scope == 'full') &&
      needs.validate_release_source.result == 'success' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      (needs.gateway.result == 'success' || needs.gateway.result == 'skipped') &&
      (needs.auth.result == 'success' || needs.auth.result == 'skipped') &&
      (needs.core.result == 'success' || needs.core.result == 'skipped')
    uses: ./.github/workflows/deploy-remote-agent-worker.yml
    with:
      deploy_environment: production
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit
