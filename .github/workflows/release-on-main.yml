name: 🚀 Scoped Production Release
run-name: Scoped Production Release ${{ inputs.scope }} @ ${{ inputs.release_sha }}

permissions:
  contents: write
  actions: read
  checks: read
  statuses: read
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact 40-character main commit SHA approved for this release"
        required: true
        type: string
      scope:
        description: "One component by default; cloud/full are explicit fleet releases"
        required: true
        type: choice
        default: web
        options:
          - database
          - database-auth
          - database-core
          - web
          - gateway
          - auth
          - core
          - core-current-cli-projection
          - remote-agent
          - cloud
          - full
      production_train_scopes:
        description: "Comma-separated release train for dependency checks; only the selected stage builds client artifacts"
        required: true
        type: string

jobs:
  reject_non_main:
    name: Reject Non-Main Production Deploy
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          echo "::error::Production deploys must run from main. Current ref: ${GITHUB_REF}"
          exit 1

  validate_release_source:
    name: Validate Immutable Main Release Source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      production_train_scopes: ${{ inputs.production_train_scopes }}
      parent_admission_evidence: ${{ steps.train_admission.outputs.parent_admission_evidence }}
      parent_web_artifact_id: ${{ steps.web_artifact.outputs.artifact-id }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: release-control
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Refresh current main with step-scoped read authentication
        uses: ./release-control/.github/actions/trusted-git-network
        with:
          github_token: ${{ github.token }}
          operation: fetch-main
          repository: ${{ github.repository }}
          working_directory: release-control

      - name: Require release SHA from main first-parent history
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        working-directory: release-control
        run: |
          set -euo pipefail
          if ! validation_error="$(node scripts/release/require-mainline-release-sha.mjs \
            "$RELEASE_SHA" refs/remotes/origin/main 2>&1)"; then
            echo "::error::$validation_error"
            exit 1
          fi

      - name: Checkout release source for train admission
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          path: release-source
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Setup release train admission
        uses: ./release-control/.github/actions/setup-node-pnpm
        with:
          control_directory: release-control
          working_directory: release-source

      - name: Admit selected stage artifacts before Production mutation
        id: train_admission
        shell: bash
        env:
          OPENMELD_PRODUCTION_TRAIN_SCOPES: ${{ inputs.production_train_scopes }}
          RELEASE_SCOPE: ${{ inputs.scope }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        working-directory: release-source
        run: |
          set -euo pipefail
          case "$RELEASE_SCOPE" in
            database) selected_scopes="db" ;;
            database-auth) selected_scopes="db,auth" ;;
            database-core) selected_scopes="db,core" ;;
            core-current-cli-projection) selected_scopes="core" ;;
            cloud) selected_scopes="auth,web,gateway,core,remote-agent" ;;
            full) selected_scopes="db,auth,web,gateway,core,remote-agent" ;;
            *) selected_scopes="$RELEASE_SCOPE" ;;
          esac
          node ../release-control/scripts/release/production-train-artifact-admission.mjs \
            --source-sha "$RELEASE_SHA" \
            --scope "$selected_scopes" \
            --issue-parent-evidence

      - name: Preserve the admitted Web snapshot for this run
        id: web_artifact
        if: steps.train_admission.outputs.has_web_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-train-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-source/dev-tmp/release-artifact-check/web.json
            release-source/dev-tmp/release-artifact-check/artifacts/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Admit the hosted fleet deployment order before Production mutation
        if: inputs.scope == 'cloud' || inputs.scope == 'full'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SCOPE: ${{ inputs.scope }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        working-directory: release-source
        run: |
          node ../release-control/scripts/release/hosted-fleet-plan-admission.mjs \
            --release-source "$PWD" \
            --release-sha "$RELEASE_SHA" \
            --scope "$RELEASE_SCOPE"

  database:
    name: Release Production Database
    needs: validate_release_source
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.scope == 'database' ||
       inputs.scope == 'database-auth' ||
       inputs.scope == 'database-core' ||
       inputs.scope == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-production-database
      queue: max
      cancel-in-progress: false
    environment: production
    env:
      BETTER_AUTH_OPENMELD_SECRET: ci_codegen_only_secret_please_do_not_use_1234567890
      AUTH_WORKER_NODE_ENV: development
      BETTER_AUTH_URL: http://localhost:8788
      WEB_APP_URL: http://localhost:8788
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: 15f16284-5240-4675-b626-3b7144e1d684
    steps:
      - name: Require main
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production deploys must run from main. Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Checkout trusted release control
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          path: release-control
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          path: release-source
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Setup repository toolchain
        uses: ./release-control/.github/actions/setup-node-pnpm
        with:
          node_version: ${{ fromJSON(needs.validate_release_source.outputs.parent_admission_evidence).buildInputs.node }}
          control_directory: release-control
          working_directory: release-source

      - name: Acquire shared Database release lease
        id: scope_lease
        uses: ./release-control/.github/actions/production-scope-lease
        with:
          github_token: ${{ github.token }}
          operation: acquire
          owner: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          scope: db
          source_sha: ${{ inputs.release_sha }}
          working_directory: release-source

      - name: Generate, migrate, verify, and optimize production database
        uses: ./release-control/.github/actions/shared-db-gate
        with:
          parent_admission_evidence: ${{ needs.validate_release_source.outputs.parent_admission_evidence }}
          production_train_scopes: ${{ needs.validate_release_source.outputs.production_train_scopes }}
          release_sha: ${{ inputs.release_sha }}
          working_directory: release-source

      - name: Release shared Database release lease
        if: always() && steps.scope_lease.outputs.lease_sha != ''
        uses: ./release-control/.github/actions/production-scope-lease
        with:
          github_token: ${{ github.token }}
          lease_sha: ${{ steps.scope_lease.outputs.lease_sha }}
          operation: release
          scope: db
          working_directory: release-source

  web:
    name: Release Web
    needs:
      - database
      - auth
      - validate_release_source
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (inputs.scope == 'web' || inputs.scope == 'cloud' || inputs.scope == 'full') &&
      needs.validate_release_source.result == 'success' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (needs.auth.result == 'success' || needs.auth.result == 'skipped')
    uses: ./.github/workflows/deploy-web.yml
    with:
      parent_web_artifact_id: ${{ needs.validate_release_source.outputs.parent_web_artifact_id }}
      parent_admission_evidence: ${{ needs.validate_release_source.outputs.parent_admission_evidence }}
      deploy_environment: production
      production_train_scopes: ${{ needs.validate_release_source.outputs.production_train_scopes }}
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit

  gateway:
    name: Release Gateway Worker
    needs:
      - database
      - web
      - validate_release_source
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (inputs.scope == 'gateway' || inputs.scope == 'cloud' || inputs.scope == 'full') &&
      needs.validate_release_source.result == 'success' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped')
    uses: ./.github/workflows/deploy-gateway-worker.yml
    with:
      parent_admission_evidence: ${{ needs.validate_release_source.outputs.parent_admission_evidence }}
      deploy_environment: production
      production_train_scopes: ${{ needs.validate_release_source.outputs.production_train_scopes }}
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit

  auth:
    name: Release Auth Worker
    needs:
      - database
      - validate_release_source
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (inputs.scope == 'auth' ||
       inputs.scope == 'database-auth' ||
       inputs.scope == 'cloud' ||
       inputs.scope == 'full') &&
      needs.validate_release_source.result == 'success' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped')
    uses: ./.github/workflows/deploy-auth-worker.yml
    with:
      parent_admission_evidence: ${{ needs.validate_release_source.outputs.parent_admission_evidence }}
      deploy_environment: production
      production_train_scopes: ${{ needs.validate_release_source.outputs.production_train_scopes }}
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit

  core:
    name: Release Core Worker
    needs:
      - database
      - web
      - gateway
      - auth
      - validate_release_source
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (inputs.scope == 'core' ||
       inputs.scope == 'core-current-cli-projection' ||
       inputs.scope == 'database-core' ||
       inputs.scope == 'cloud' ||
       inputs.scope == 'full') &&
      needs.validate_release_source.result == 'success' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      (needs.gateway.result == 'success' || needs.gateway.result == 'skipped') &&
      (needs.auth.result == 'success' || needs.auth.result == 'skipped')
    uses: ./.github/workflows/deploy-core-worker.yml
    with:
      parent_admission_evidence: ${{ needs.validate_release_source.outputs.parent_admission_evidence }}
      deploy_environment: production
      deployment_mode: ${{ inputs.scope == 'core-current-cli-projection' && 'current-stable-cli-projection' || 'standard' }}
      production_train_scopes: ${{ needs.validate_release_source.outputs.production_train_scopes }}
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit

  remote_agent:
    name: Release Remote Agent Worker
    needs:
      - database
      - web
      - gateway
      - auth
      - core
      - validate_release_source
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (inputs.scope == 'remote-agent' || inputs.scope == 'cloud' || inputs.scope == 'full') &&
      needs.validate_release_source.result == 'success' &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      (needs.gateway.result == 'success' || needs.gateway.result == 'skipped') &&
      (needs.auth.result == 'success' || needs.auth.result == 'skipped') &&
      (needs.core.result == 'success' || needs.core.result == 'skipped')
    uses: ./.github/workflows/deploy-remote-agent-worker.yml
    with:
      parent_admission_evidence: ${{ needs.validate_release_source.outputs.parent_admission_evidence }}
      deploy_environment: production
      production_train_scopes: ${{ needs.validate_release_source.outputs.production_train_scopes }}
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit
