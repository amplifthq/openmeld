name: 🤖 Deploy Remote Agent Worker
run-name: Deploy Remote Agent Worker @ ${{ inputs.release_sha }}

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      deploy_environment:
        description: "Deployment environment"
        required: false
        type: string
        default: production
      release_sha:
        description: "Exact main commit to deploy"
        required: true
        type: string

jobs:
  validate_release_source:
    name: Validate Immutable Main Release Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted current main validation code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: release-control
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Refresh current main with step-scoped read authentication
        uses: ./release-control/.github/actions/trusted-git-network
        with:
          github_token: ${{ github.token }}
          operation: fetch-main
          repository: ${{ github.repository }}
          working_directory: release-control

      - name: Require production target and main first-parent release SHA
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.deploy_environment }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        working-directory: release-control
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENVIRONMENT" != "production" ]; then
            echo "::error::Unsupported deploy environment. Only production is allowed."
            exit 1
          fi
          node scripts/release/require-mainline-release-sha.mjs \
            "$RELEASE_SHA" refs/remotes/origin/main

  deploy:
    name: 🤖 Deploy Remote Agent Worker
    needs: validate_release_source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-remote-agent-worker-production
      queue: max
      cancel-in-progress: false
    environment: production
    defaults:
      run:
        working-directory: release-source
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          path: release-control
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          path: release-source
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Setup repository toolchain
        uses: ./release-control/.github/actions/setup-node-pnpm
        with:
          control_directory: release-control
          working_directory: release-source

      - name: Acquire shared Remote Agent release lease
        id: scope_lease
        uses: ./release-control/.github/actions/production-scope-lease
        with:
          github_token: ${{ github.token }}
          operation: acquire
          owner: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          scope: remote-agent
          source_sha: ${{ inputs.release_sha }}
          working_directory: release-source

      - name: Run Remote Agent Worker deployment preflight
        run: pnpm run release:preflight:local -- --scope remote-agent --base HEAD

      - name: Deploy Remote Agent Worker
        run: pnpm -C services/remote-agent run sync:config:prod

      - name: Verify Remote Agent deployment is visible
        run: pnpm exec wrangler deployments list --config services/remote-agent/dist/openmeld_remote_agent/wrangler.prod.json --json > /dev/null

      - name: Release shared Remote Agent release lease
        if: always() && steps.scope_lease.outputs.lease_sha != ''
        uses: ./release-control/.github/actions/production-scope-lease
        with:
          github_token: ${{ github.token }}
          lease_sha: ${{ steps.scope_lease.outputs.lease_sha }}
          operation: release
          scope: remote-agent
          working_directory: release-source
