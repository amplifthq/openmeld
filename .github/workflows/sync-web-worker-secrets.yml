name: 🔐 Sync Web Worker Secrets

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Worker environment"
        required: true
        type: choice
        default: production
        options:
          - production

jobs:
  sync:
    name: 🔐 Sync Web Worker Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sync-web-worker-secrets-production
      queue: max
      cancel-in-progress: false
    environment: production
    steps:
      - name: Validate sync target
        run: |
          if [ "${{ github.event.inputs.target_environment || 'production' }}" != "production" ]; then
            echo "::error::Unsupported target environment. Only production is allowed."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Web Worker secrets
        run: |
          if [ -z "${WEB_OPENMELD_SPACE_ACCESS_COOKIE_SECRET}" ]; then
            echo "::error::Missing WEB_OPENMELD_SPACE_ACCESS_COOKIE_SECRET in GitHub environment secrets."
            exit 1
          fi

          secrets_file="clients/web/.dev.vars.prod"
          trap 'rm -f "$secrets_file"' EXIT

          {
            printf "WEB_OPENMELD_SPACE_ACCESS_COOKIE_SECRET=%s\n" "${WEB_OPENMELD_SPACE_ACCESS_COOKIE_SECRET}"
          } > "$secrets_file"

          pnpm -C clients/web run sync:secrets:prod
        env:
          WEB_OPENMELD_SPACE_ACCESS_COOKIE_SECRET: ${{ secrets.WEB_OPENMELD_SPACE_ACCESS_COOKIE_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
