name: 🔐 Sync Auth Worker Secrets

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Worker environment"
        required: true
        type: choice
        default: production
        options:
          - production

jobs:
  sync:
    name: 🔐 Sync Auth Worker Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sync-auth-worker-secrets-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Validate sync target
        run: |
          if [ "${{ github.event.inputs.target_environment || 'production' }}" != "production" ]; then
            echo "::error::Unsupported target environment. Only production is allowed."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Auth Worker secrets
        run: |
          if [ -z "${BETTER_AUTH_OPENMELD_SECRET}" ]; then
            echo "::error::Missing BETTER_AUTH_OPENMELD_SECRET in GitHub environment secrets."
            exit 1
          fi
          if [ -z "${GITHUB_OPENMELD_AUTH_OAUTH_CLIENT_SECRET}" ]; then
            echo "::error::Missing GITHUB_OPENMELD_AUTH_OAUTH_CLIENT_SECRET in GitHub environment secrets."
            exit 1
          fi
          if [ -z "${GOOGLE_OPENMELD_AUTH_OAUTH_CLIENT_SECRET}" ]; then
            echo "::error::Missing GOOGLE_OPENMELD_AUTH_OAUTH_CLIENT_SECRET in GitHub environment secrets."
            exit 1
          fi
          secrets_file="services/auth/.dev.vars.prod"
          trap 'rm -f "$secrets_file"' EXIT

          {
            printf "BETTER_AUTH_OPENMELD_SECRET=%s\n" "${BETTER_AUTH_OPENMELD_SECRET}"
            printf "GITHUB_OPENMELD_AUTH_OAUTH_CLIENT_SECRET=%s\n" "${GITHUB_OPENMELD_AUTH_OAUTH_CLIENT_SECRET}"
            printf "GOOGLE_OPENMELD_AUTH_OAUTH_CLIENT_SECRET=%s\n" "${GOOGLE_OPENMELD_AUTH_OAUTH_CLIENT_SECRET}"
          } > "$secrets_file"

          pnpm -C services/auth run sync:secrets:prod
        env:
          BETTER_AUTH_OPENMELD_SECRET: ${{ secrets.BETTER_AUTH_OPENMELD_SECRET }}
          GITHUB_OPENMELD_AUTH_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OPENMELD_AUTH_OAUTH_CLIENT_SECRET }}
          GOOGLE_OPENMELD_AUTH_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OPENMELD_AUTH_OAUTH_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
