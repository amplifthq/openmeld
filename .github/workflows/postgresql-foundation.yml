name: PostgreSQL foundation

on:
  pull_request:
    paths:
      - "tooling/postgresql/**"
      - "packages/db/postgresql/**"
      - ".github/workflows/postgresql-foundation.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-postgresql
      - name: Build the shared native database package
        run: pnpm exec turbo run build --filter=@openmeld/db
      - name: Verify isolated migrations, permissions, and recovery
        run: |
          node tooling/postgresql/verify.mjs
          pnpm --filter @openmeld/postgresql check
          pnpm pg:check
