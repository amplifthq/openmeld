name: 🚪 Deploy Gateway Worker
run-name: Deploy Gateway Worker @ ${{ inputs.release_sha }}

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      deploy_environment:
        description: "Deployment environment"
        required: false
        type: string
        default: production
      release_sha:
        description: "Exact main commit to deploy"
        required: true
        type: string

jobs:
  validate_release_source:
    name: Validate Immutable Main Release Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted current main validation code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: release-control
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require production target and main first-parent release SHA
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.deploy_environment }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        working-directory: release-control
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENVIRONMENT" != "production" ]; then
            echo "::error::Unsupported deploy environment. Only production is allowed."
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          node scripts/release/require-mainline-release-sha.mjs \
            "$RELEASE_SHA" refs/remotes/origin/main

  deploy:
    name: 🚪 Deploy Gateway Worker
    needs: validate_release_source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-gateway-worker-production
      cancel-in-progress: false
    environment: production
    defaults:
      run:
        working-directory: release-source
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          path: release-control
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          path: release-source
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Setup repository toolchain
        uses: ./release-control/.github/actions/setup-node-pnpm
        with:
          control_directory: release-control
          working_directory: release-source

      - name: Acquire shared Gateway release lease
        id: scope_lease
        uses: ./release-control/.github/actions/production-scope-lease
        with:
          github_token: ${{ github.token }}
          operation: acquire
          owner: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          scope: gateway
          source_sha: ${{ inputs.release_sha }}
          working_directory: release-source

      - name: Run Gateway Worker deployment preflight
        run: pnpm run release:preflight:local -- --scope gateway --base HEAD

      - name: Deploy Gateway Worker
        run: pnpm -C services/gateway run sync:config:prod

      - name: Verify Gateway Worker health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 https://gateway.openmeld.ai/health > /dev/null

      - name: Release shared Gateway release lease
        if: always() && steps.scope_lease.outputs.lease_sha != ''
        uses: ./release-control/.github/actions/production-scope-lease
        with:
          github_token: ${{ github.token }}
          lease_sha: ${{ steps.scope_lease.outputs.lease_sha }}
          operation: release
          scope: gateway
          working_directory: release-source
