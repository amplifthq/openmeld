name: Draft PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: pr-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select draft tests
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      workspaces: ${{ steps.matrix.outputs.workspaces }}
      has_workspaces: ${{ steps.matrix.outputs.has_workspaces }}
    env:
      OPENMELD_AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Select changed workspaces
        id: matrix
        shell: bash
        run: |
          matrix_json="$(node scripts/dev/verify-pr.mjs --feedback --matrix)"
          printf 'workspaces=%s\n' "$matrix_json" >> "$GITHUB_OUTPUT"
          if [ "$matrix_json" = '{"include":[]}' ]; then
            printf 'has_workspaces=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has_workspaces=true\n' >> "$GITHUB_OUTPUT"
          fi

  shared:
    name: Shared draft checks
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENMELD_AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Show selected checks
        run: pnpm run verify:pr -- --feedback --shared --plan
      - name: Run shared draft checks
        env:
          OPENMELD_HOME: ${{ runner.temp }}/openmeld-pr-feedback
        run: pnpm run verify:pr -- --feedback --shared

  workspaces:
    name: Tests (${{ matrix.label }})
    needs: plan
    if: needs.plan.outputs.has_workspaces == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.workspaces) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENMELD_AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}
      VERIFY_PR_WORKSPACE: ${{ matrix.directory }}
      VERIFY_PR_SHARD: ${{ matrix.shard }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run selected workspace tests
        env:
          OPENMELD_HOME: ${{ runner.temp }}/openmeld-pr-feedback
        run: pnpm run verify:pr -- --feedback
