name: ⚙️ Deploy Core Worker
run-name: Deploy Core Worker @ ${{ inputs.release_sha || github.sha }}

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: production
        options:
          - production
      release_sha:
        description: "Optional exact main commit to deploy"
        required: false
        type: string
        default: ""
      deployment_mode:
        description: "Deploy the checked-in projection or recover the current stable CLI projection"
        required: true
        type: choice
        default: standard
        options:
          - standard
          - current-stable-cli-projection
  workflow_call:
    inputs:
      deploy_environment:
        description: "Deployment environment"
        required: false
        type: string
        default: production
      release_sha:
        description: "Exact main commit to deploy"
        required: false
        type: string
        default: ""
      deployment_mode:
        description: "Core deployment mode"
        required: false
        type: string
        default: standard

jobs:
  deploy:
    name: ⚙️ Deploy Core Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-core-worker-production
      cancel-in-progress: false
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate production target
        shell: bash
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.deploy_environment || 'production' }}" != "production" ]; then
            echo "::error::Unsupported deploy environment. Only production is allowed."
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production deploys must run from main. Current ref: ${GITHUB_REF}"
            exit 1
          fi
          case "$DEPLOYMENT_MODE" in
            standard|current-stable-cli-projection) ;;
            *)
              echo "::error::Unsupported Core deployment mode: $DEPLOYMENT_MODE"
              exit 1
              ;;
          esac

      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Acquire shared Core release lease
        id: scope_lease
        uses: ./.github/actions/production-scope-lease
        with:
          operation: acquire
          owner: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          scope: core
          source_sha: ${{ inputs.release_sha || github.sha }}

      - name: Run Core Worker deployment preflight
        if: inputs.deployment_mode == 'standard'
        run: pnpm run release:preflight:local -- --scope core --base HEAD

      - name: Run current-stable Core recovery preflight
        if: inputs.deployment_mode == 'current-stable-cli-projection'
        run: pnpm run release:preflight:core-current-cli-projection

      - name: Capture Core bundle evidence
        run: pnpm run evidence:bundle:core

      - name: Capture local Core startup evidence
        continue-on-error: true
        run: pnpm run evidence:startup:core

      - name: Fetch immutable CLI release tags
        if: inputs.deployment_mode == 'current-stable-cli-projection'
        run: git fetch --tags

      - name: Admit and deploy the standard Core Worker
        if: inputs.deployment_mode == 'standard'
        run: >-
          node scripts/release/deploy-core-worker.mjs
          --release-sha "${{ inputs.release_sha || github.sha }}"

      - name: Recover Core with the current stable CLI projection
        if: inputs.deployment_mode == 'current-stable-cli-projection'
        run: >-
          node scripts/release/deploy-core-current-cli-projection.mjs
          --release-sha "${{ inputs.release_sha || github.sha }}"

      - name: Verify Core deployment is visible
        run: pnpm exec wrangler deployments list --config services/core/wrangler.jsonc --env prod --json > /dev/null

      - name: Preserve Core bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-bundle-evidence-${{ inputs.release_sha || github.sha }}
          if-no-files-found: warn
          path: dev-tmp/core-bundle-evidence.json
          retention-days: 30

      - name: Preserve Core startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-startup-evidence-${{ inputs.release_sha || github.sha }}
          if-no-files-found: warn
          path: |
            dev-tmp/core-startup-evidence.json
            dev-tmp/core-startup-admission.json
          retention-days: 30

      - name: Preserve the local Core startup profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-startup-profile-${{ inputs.release_sha || github.sha }}
          if-no-files-found: warn
          path: dev-tmp/core-startup.cpuprofile
          retention-days: 14

      - name: Preserve a failed Core startup profile
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-failed-deploy-startup-profile-${{ inputs.release_sha || github.sha }}
          if-no-files-found: ignore
          path: services/core/.wrangler/tmp/startup-profile-*/worker.cpuprofile
          retention-days: 14

      - name: Release shared Core release lease
        if: always() && steps.scope_lease.outputs.lease_sha != ''
        uses: ./.github/actions/production-scope-lease
        with:
          lease_sha: ${{ steps.scope_lease.outputs.lease_sha }}
          operation: release
          scope: core
