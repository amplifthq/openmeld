name: ⚙️ Deploy Core Worker
run-name: Deploy Core Worker @ ${{ inputs.release_sha }}

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      deploy_environment:
        description: "Deployment environment"
        required: false
        type: string
        default: production
      release_sha:
        description: "Exact main commit to deploy"
        required: true
        type: string
      deployment_mode:
        description: "Core deployment mode"
        required: false
        type: string
        default: standard

jobs:
  validate_release_source:
    name: Validate Immutable Main Release Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted current main validation code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Require production target, deployment mode, and main first-parent release SHA
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.deploy_environment }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENVIRONMENT" != "production" ]; then
            echo "::error::Unsupported deploy environment. Only production is allowed."
            exit 1
          fi
          case "$DEPLOYMENT_MODE" in
            standard|current-stable-cli-projection) ;;
            *)
              echo "::error::Unsupported Core deployment mode: $DEPLOYMENT_MODE"
              exit 1
              ;;
          esac
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          node scripts/release/require-mainline-release-sha.mjs \
            "$RELEASE_SHA" refs/remotes/origin/main

  deploy:
    name: ⚙️ Deploy Core Worker
    needs: validate_release_source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-core-worker-production
      cancel-in-progress: false
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.release_sha }}

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Acquire shared Core release lease
        id: scope_lease
        uses: ./.github/actions/production-scope-lease
        with:
          operation: acquire
          owner: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          scope: core
          source_sha: ${{ inputs.release_sha }}

      - name: Run Core Worker deployment preflight
        if: inputs.deployment_mode == 'standard'
        run: pnpm run release:preflight:local -- --scope core --base HEAD

      - name: Run current-stable Core recovery preflight
        if: inputs.deployment_mode == 'current-stable-cli-projection'
        run: pnpm run release:preflight:core-current-cli-projection

      - name: Capture Core bundle evidence
        run: pnpm run evidence:bundle:core

      - name: Capture local Core startup evidence
        continue-on-error: true
        run: pnpm run evidence:startup:core

      - name: Fetch immutable CLI release tags
        if: inputs.deployment_mode == 'current-stable-cli-projection'
        run: git fetch --tags

      - name: Admit and deploy the standard Core Worker
        if: inputs.deployment_mode == 'standard'
        run: >-
          node scripts/release/deploy-core-worker.mjs
          --release-sha "${{ inputs.release_sha }}"

      - name: Recover Core with the current stable CLI projection
        if: inputs.deployment_mode == 'current-stable-cli-projection'
        run: >-
          node scripts/release/deploy-core-current-cli-projection.mjs
          --release-sha "${{ inputs.release_sha }}"

      - name: Verify Core deployment is visible
        run: pnpm exec wrangler deployments list --config services/core/wrangler.jsonc --env prod --json > /dev/null

      - name: Preserve Core bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-bundle-evidence-${{ inputs.release_sha }}
          if-no-files-found: warn
          path: dev-tmp/core-bundle-evidence.json
          retention-days: 30

      - name: Preserve Core startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-startup-evidence-${{ inputs.release_sha }}
          if-no-files-found: warn
          path: |
            dev-tmp/core-startup-evidence.json
            dev-tmp/core-startup-admission.json
          retention-days: 30

      - name: Preserve the local Core startup profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-startup-profile-${{ inputs.release_sha }}
          if-no-files-found: warn
          path: dev-tmp/core-startup.cpuprofile
          retention-days: 14

      - name: Preserve a failed Core startup profile
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-failed-deploy-startup-profile-${{ inputs.release_sha }}
          if-no-files-found: ignore
          path: services/core/.wrangler/tmp/startup-profile-*/worker.cpuprofile
          retention-days: 14

      - name: Release shared Core release lease
        if: always() && steps.scope_lease.outputs.lease_sha != ''
        uses: ./.github/actions/production-scope-lease
        with:
          lease_sha: ${{ steps.scope_lease.outputs.lease_sha }}
          operation: release
          scope: core
