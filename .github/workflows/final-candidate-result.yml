name: OpenMeld Final Candidate Result
run-name: Final Candidate Result ${{ github.event.workflow_run.id }}:${{ github.event.workflow_run.run_attempt }} ${{ github.event.action }}

on:
  workflow_run:
    workflows: [OpenMeld Final Candidate]
    types: [completed]

permissions: {}

concurrency:
  group: final-candidate-result-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    if: github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.display_title, 'Final Candidate PR ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      valid: ${{ steps.identity.outputs.valid }}
      head: ${{ steps.identity.outputs.head }}
      base: ${{ steps.identity.outputs.base }}
      pr: ${{ steps.identity.outputs.pr }}
      confidence: ${{ steps.identity.outputs.confidence }}
      state: ${{ steps.publish_final.outputs.state }}
      description: ${{ steps.publish_final.outputs.description }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_REPOSITORY: ${{ github.repository }}
      CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id }}
      CANDIDATE_SERVER_URL: ${{ github.server_url }}
    steps:
      - name: Checkout trusted publisher only
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: trusted-control
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify GitHub run and live PR identity
        id: identity
        run: node trusted-control/scripts/ci/final-candidate-run-context.mjs

      # Fetch immutable objects only. The trusted working tree remains on main.
      # The exact base may be older than the shallow checkout, so fetch it too.
      - name: Read candidate Git objects without checkout
        if: steps.identity.outputs.valid == 'true'
        env:
          CANDIDATE_BASE_SHA: ${{ steps.identity.outputs.base }}
          CANDIDATE_HEAD_SHA: ${{ steps.identity.outputs.head }}
        run: git -C trusted-control -c core.hooksPath=/dev/null fetch --no-tags --no-recurse-submodules origin "$CANDIDATE_HEAD_SHA" "$CANDIDATE_BASE_SHA"

      - name: Recompute hosted disposition from trusted control
        if: steps.identity.outputs.valid == 'true'
        id: disposition
        env:
          CANDIDATE_HEAD_SHA: ${{ steps.identity.outputs.head }}
        run: |
          node trusted-control/scripts/ci/final-candidate-hosted-disposition.mjs \
            --trusted-root "$GITHUB_WORKSPACE/trusted-control" \
            --candidate-root "$GITHUB_WORKSPACE/trusted-control" \
            --candidate-ref "$CANDIDATE_HEAD_SHA"

      - name: Setup pnpm
        if: steps.identity.outputs.valid == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
          run_install: false

      - name: Install trusted evidence parser only
        if: steps.identity.outputs.valid == 'true'
        run: pnpm --dir trusted-control install --frozen-lockfile --filter @openmeld/schemas --prod --ignore-scripts

      - name: Download evidence from this exact run
        if: steps.identity.outputs.valid == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: final-candidate-evidence
          path: ${{ runner.temp }}/final-candidate

      - name: Validate evidence without write permissions
        id: publish_final
        if: success() && steps.identity.outputs.valid == 'true'
        env:
          CANDIDATE_BASE_SHA: ${{ steps.identity.outputs.base }}
          CANDIDATE_BRANCH: ${{ steps.identity.outputs.branch }}
          CANDIDATE_CONFIDENCE: ${{ steps.identity.outputs.confidence }}
          CANDIDATE_HEAD_SHA: ${{ steps.identity.outputs.head }}
          CANDIDATE_PR_NUMBER: ${{ steps.identity.outputs.pr }}
          CANDIDATE_TREE_SHA: ${{ steps.identity.outputs.tree }}
          CANDIDATE_JOB_RESULT: ${{ steps.identity.outputs.job_result }}
          CANDIDATE_HOSTED_DISPOSITION: ${{ steps.disposition.outputs.disposition }}
        run: |
          node trusted-control/scripts/ci/final-candidate-publisher.mjs \
            --output-only true \
            --repository "$CANDIDATE_REPOSITORY" --pr "$CANDIDATE_PR_NUMBER" \
            --branch "$CANDIDATE_BRANCH" --head "$CANDIDATE_HEAD_SHA" \
            --base "$CANDIDATE_BASE_SHA" --tree "$CANDIDATE_TREE_SHA" \
            --candidate-root "$GITHUB_WORKSPACE/trusted-control" \
            --confidence "$CANDIDATE_CONFIDENCE" \
            --hosted-disposition "$CANDIDATE_HOSTED_DISPOSITION" \
            --job-result "$CANDIDATE_JOB_RESULT" \
            --evidence "$RUNNER_TEMP/final-candidate/final-candidate-evidence.json" \
            --target-url "$CANDIDATE_SERVER_URL/$CANDIDATE_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID"


  publish:
    needs: verify
    if: always() && needs.verify.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_REPOSITORY: ${{ github.repository }}
      CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id }}
      CANDIDATE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      CANDIDATE_SERVER_URL: ${{ github.server_url }}
      CANDIDATE_HEAD_SHA: ${{ needs.verify.outputs.head }}
      CANDIDATE_PR_NUMBER: ${{ needs.verify.outputs.pr }}
      CANDIDATE_CONFIDENCE: ${{ needs.verify.outputs.confidence }}
      VERIFIED_STATE: ${{ needs.verify.outputs.state }}
      VERIFIED_DESCRIPTION: ${{ needs.verify.outputs.description }}
      VERIFIER_RESULT: ${{ needs.verify.result }}
    steps:
      # No source checkout, dependency install, or artifact download in this job.
      # The exact head, base, and tree were bound by the verifier. A later main
      # advance does not fail this result: merge queue or strict up-to-date
      # protection owns freshness at merge time.
      - name: Recheck live head and publish status
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$CANDIDATE_REPOSITORY/pulls/$CANDIDATE_PR_NUMBER")"
          test "$(jq -r .head.sha <<<"$pr_json")" = "$CANDIDATE_HEAD_SHA"
          runs="$(gh api "repos/$CANDIDATE_REPOSITORY/actions/workflows/final-candidate.yml/runs?event=pull_request&head_sha=$CANDIDATE_HEAD_SHA&per_page=100")"
          latest_id="$(jq -r --arg pr "$CANDIDATE_PR_NUMBER" '.workflow_runs | map(select(.display_title | startswith("Final Candidate PR #" + $pr + " @ "))) | sort_by(.created_at, .id) | last | .id' <<<"$runs")"
          if [ "$latest_id" != "$CANDIDATE_RUN_ID" ]; then exit 0; fi
          source_run="$(gh api "repos/$CANDIDATE_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          if [ "$(jq -r .run_attempt <<<"$source_run")" != "$CANDIDATE_RUN_ATTEMPT" ]; then exit 0; fi
          state=failure
          description='Final Candidate result validation failed'
          if [ "$VERIFIER_RESULT" = success ] && [ "$VERIFIED_STATE" = success ]; then
            state=success
            description="$VERIFIED_DESCRIPTION"
          elif [ "$VERIFIER_RESULT" = success ] && [ "$VERIFIED_STATE" = failure ]; then
            description="$VERIFIED_DESCRIPTION"
          fi
          status_history() {
            gh api --paginate --slurp "repos/$CANDIDATE_REPOSITORY/commits/$CANDIDATE_HEAD_SHA/statuses?per_page=100" |
              jq -ce 'add | map(select(.context == "OpenMeld Final Candidate"))'
          }
          # GitHub returns newest first. Keep the ID of the actual request
          # even if a concurrent terminal write has temporarily hidden it.
          latest_request() {
            jq -c --arg sha "${CANDIDATE_HEAD_SHA:0:12}" '
              (first(.[] | select(.state == "pending" and
                (.description == ("Requested standard Final Candidate @ " + $sha + "; waiting for its result") or
                 .description == ("Requested full Final Candidate @ " + $sha + "; waiting for its result") or
                 ((.description // "") | startswith("Running ") and contains("@ " + $sha + " on "))))) // null) |
              if (.description // "" | startswith("Requested ")) then . else null end'
          }
          request_fulfilled() {
            local prior legacy target published_at prior_source
            prior="$(jq -ce --argjson r "$request" '.[:index($r)] | map(select(.state == "success" or .state == "failure" or .state == "error"))' <<<"$before")" || return 2
            if jq -e --arg suffix "; request $request_id" --arg prefix "$actions_url/" --arg passed "Passed $confidence @ ${CANDIDATE_HEAD_SHA:0:12} on " '
              any(.[]; ((.description // "") | endswith($suffix)) and
                (.state != "success" or (.description | startswith($passed))) and
                ((.target_url // "") | startswith($prefix) and (ltrimstr($prefix) | test("^[0-9]+/attempts/[0-9]+$"))))' <<<"$prior" >/dev/null; then return 0; fi
            # Legacy hosted results carry no receipt. Verify the referenced
            # source before allowing a later automatic run to change confidence.
            legacy="$(jq -r --arg prefix "$actions_url/" --arg passed "Passed $confidence @ ${CANDIDATE_HEAD_SHA:0:12} on " '
              .[] | select(((.description // "") | contains("; request ") | not) and
                (.state != "success" or (.description | startswith($passed)))) |
              . as $status | (.target_url // "") | select(startswith($prefix)) | ltrimstr($prefix) |
              select(test("^[1-9][0-9]*(/attempts/[1-9][0-9]*)?$")) | [., $status.created_at] | @tsv' <<<"$prior")" || return 2
            while IFS=$'\t' read -r target published_at; do
              [[ -n "$target" ]] || continue
              prior_source="$(gh api "repos/$CANDIDATE_REPOSITORY/actions/runs/$target")" || return 2
              if jq -e --arg title "Final Candidate PR #${request_url##*/} @ $CANDIDATE_HEAD_SHA [$confidence] on " \
                --argjson since "$request_created" --arg target "$target" --arg published "$published_at" --arg head "$CANDIDATE_HEAD_SHA" '
                .event == "pull_request" and .path == ".github/workflows/final-candidate.yml" and
                .head_sha == $head and (.id | tostring) == ($target | split("/")[0]) and
                (.display_title | startswith($title) and (ltrimstr($title) | test("^[0-9a-f]{40}$"))) and
                (.created_at | fromdateiso8601) > $since and
                (if ($target | contains("/")) then (.run_attempt | tostring) == ($target | split("/")[2])
                 else .run_attempt == 1 or ($published | fromdateiso8601) > (.run_started_at | fromdateiso8601) end)' <<<"$prior_source" >/dev/null; then return 0; fi
            done <<<"$legacy"
            return 1
          }
          post_status() {
            gh api --method POST "repos/$CANDIDATE_REPOSITORY/statuses/$CANDIDATE_HEAD_SHA" \
              -f state="$1" -f context='OpenMeld Final Candidate' -f description="$2" -f target_url="$3" --jq '.id'
          }
          pr_url="$CANDIDATE_SERVER_URL/$CANDIDATE_REPOSITORY/pull/$CANDIDATE_PR_NUMBER"
          actions_url="$CANDIDATE_SERVER_URL/$CANDIDATE_REPOSITORY/actions/runs"
          run_url="$actions_url/$CANDIDATE_RUN_ID/attempts/$CANDIDATE_RUN_ATTEMPT"
          before="$(status_history)"
          if jq -e '.[0].state == "pending" and ((.[0].description // "") | startswith("Running "))' <<<"$before" >/dev/null; then exit 0; fi
          request="$(latest_request <<<"$before")"
          request_id="$(jq -r '.id // empty' <<<"$request")"
          if [[ -n "$request_id" ]]; then
            # A new explicit request adds a label and creates a new source
            # run. Re-running an older source does not own the new request.
            source_created="$(jq -er '.created_at | fromdateiso8601' <<<"$source_run")"
            request_created="$(jq -er '.created_at | fromdateiso8601' <<<"$request")"
            if (( source_created <= request_created )); then exit 0; fi
            request_url="$(jq -er .target_url <<<"$request")"
            confidence="$(jq -r '.description | split(" ")[1]' <<<"$request")"
            fulfilled=0
            request_fulfilled || fulfilled=$?
            if (( fulfilled > 1 )); then exit 1; fi
            if (( fulfilled == 1 )); then
              expected="Requested $CANDIDATE_CONFIDENCE Final Candidate @ ${CANDIDATE_HEAD_SHA:0:12}; waiting for its result"
              if ! jq -e --arg description "$expected" --arg url "$pr_url" '
                .description == $description and .target_url == $url' <<<"$request" >/dev/null; then exit 0; fi
              suffix="; request $request_id"
              description="${description:0:$((140 - ${#suffix}))}$suffix"
            fi
          fi
          written="$(post_status "$state" "$description" "$run_url")"
          [[ "$written" =~ ^[0-9]+$ ]]
          # Status creation is append-only. Reconcile a request that landed
          # between the final read and our POST while our own write is latest.
          after="$(status_history)"
          if [[ "$(jq -r '.[0].id' <<<"$after")" == "$written" ]]; then
            newer="$(latest_request <<<"$after")"
            newer_id="$(jq -r '.id // empty' <<<"$newer")"
            if [[ -n "$newer_id" && "$newer_id" != "$request_id" ]]; then
              post_status pending "Waiting for the current Final Candidate request" "$(jq -er .target_url <<<"$newer")"
            fi
          fi
