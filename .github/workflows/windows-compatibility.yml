name: Windows compatibility

on:
  pull_request:
    paths:
      - clients/openmeld-cli/**
      - clients/desktop/**
      - clients/web/src/desktop/**
      - runtime/adapters/**
      - packages/schemas/**
      - packages/start/**
      - scripts/desktop/**
      - scripts/release/desktop-preview*
      - scripts/release/npm-cli-*
      - scripts/release/release-cli*
      - scripts/release/release-stage-probes*
      - clients/web/src/lib/setup-bootstrap-script*
      - clients/web/src/lib/__fixtures__/setup-bootstrap-*
      - clients/web/src/routes/setup*
      - clients/web/src/lib/desktop-*
      - clients/web/src/routes/desktop/**
      - clients/web/src/routes/desktop.tsx
      - clients/web/src/components/desktop-download/**
      - .github/workflows/windows-compatibility.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the actual CLI and its Windows process contracts
        run: pnpm exec turbo run build --filter=openmeld --concurrency=1
      - name: Install the packed CLI with clean npm and exercise its native SQLite reader
        run: node scripts/release/npm-cli-artifact.mjs
      - name: Exercise generated setup in Windows PowerShell 5.1
        run: pnpm --dir clients/web exec vitest run src/lib/setup-bootstrap-script.windows.test.ts --maxWorkers=1 --minWorkers=1
      - name: Exercise native argv, Job ownership, SDK streams, and physical probe rejection
        run: node --test --test-concurrency=1 runtime/adapters/core/test/process-launch.test.js runtime/adapters/core/test/process-environment.test.js runtime/adapters/core/test/windows-system.test.js runtime/adapters/core/test/windows-process-job.test.js runtime/adapters/codex/test/workspace-access-probe.test.js runtime/adapters/claude-code/test/windows-process.test.js
      - name: Verify Service identity and read-only capability admission
        run: pnpm --dir clients/openmeld-cli exec vitest run tests/process-identity.test.ts tests/service-control-capabilities.test.ts tests/windows-task-admission.test.ts --maxWorkers=1 --minWorkers=1
      - name: Verify console-free task hosting and stopped-task migration
        run: pnpm --dir clients/openmeld-cli exec vitest run tests/windows-task-host.native.test.ts --maxWorkers=1 --minWorkers=1
      - name: Verify Windows Desktop tool acquisition boundaries
        run: pnpm --dir clients/desktop exec vitest run tests/windows-command-environment.test.ts tests/windows-computer-tools.test.ts --maxWorkers=1 --minWorkers=1
      - name: Verify per-user package plans and Windows signing boundary
        run: node --test scripts/desktop/installed-platform.test.mjs scripts/desktop/windows-artifact.test.mjs scripts/release/desktop-preview.test.mjs
      - name: Verify updater configuration and native Authenticode
        run: pnpm --dir clients/desktop exec vitest run tests/windows-updater.test.ts tests/windows-signature.native.test.ts --maxWorkers=1 --minWorkers=1
      # Tests own disposable processes and uniquely named temporary registrations;
      # no production Service or provider login is used. Interactive task launch,
      # reboot, visual no-flash and real Codex sandbox remain user smoke.
