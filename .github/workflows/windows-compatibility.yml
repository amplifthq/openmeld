name: Windows compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-artifacts:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          # 1.3.14 returns before applying the PE subsystem flag. 1.4.2 applies
          # it inside the Windows compile path; acceptance verifies actual bytes.
          bun-version: 1.4.2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - run: pnpm install --frozen-lockfile
      - name: Build the self-contained native process helper
        # Build metadata uses the repository's shared schema contract.
        run: node scripts/release/build-windows-process-helper.mjs
      - name: Build workspace dependencies
        run: pnpm exec turbo run build --filter=openmeld^... --concurrency=1
      - name: Verify native Service path and owner classification
        run: pnpm --dir clients/openmeld-cli exec vitest run --config vitest.config.ts tests/local-service-command-path.test.ts tests/local-service-owner-snapshot.test.ts tests/local-service-process-inventory.test.ts tests/local-service-start-failure-diagnostics.test.ts
      - name: Verify leases changing during Windows startup inspection
        run: pnpm --dir clients/openmeld-cli exec vitest run --config vitest.integration.config.ts tests/local-service-inventory.integration.test.ts -t "uses the current lease"
      - name: Record native build identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dev-tmp/windows-native-evidence | Out-Null
          @{
            sha = (git rev-parse HEAD)
            run = '${{ github.run_id }}'
            attempt = '${{ github.run_attempt }}'
            image = $env:ImageOS
            imageVersion = $env:ImageVersion
            node = (node --version)
            bun = (bun --version)
            dotnet = (dotnet --version)
          } | ConvertTo-Json | Set-Content dev-tmp/windows-native-evidence/identity.json
      - name: Build console and console-free Windows artifacts
        id: artifacts
        run: |
          node scripts/release/build-cli-binary.mjs --platform windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release/build-cli-binary.mjs --platform windows-x64 --background
      - name: Exercise compiled SQLite, SDK protocol, and official Codex
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        shell: pwsh
        run: |
          $vendor = 'dev-tmp/windows-native-vendor'
          New-Item -ItemType Directory -Force $vendor | Out-Null
          $json = npm pack '@openai/codex@0.153.4-win32-x64' --json --pack-destination $vendor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = ($json | ConvertFrom-Json)[0]
          if ($package.integrity -ne 'sha512-lMkB43kJZH0VFr+hoXc11qqR7QtQIbkr07ALgj4urKL1osNyUyuy1iXd3Vzz2iCYvBUCSw7I0l/W1cEPGx9euQ==') { throw 'The pinned Codex package integrity changed.' }
          $json | Set-Content dev-tmp/windows-native-evidence/codex-package.json
          tar -xf (Join-Path $vendor $package.filename) -C $vendor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OPENMELD_TEST_CODEX = (Resolve-Path "$vendor/package/vendor/x86_64-pc-windows-msvc/bin/codex.exe").Path
          node scripts/e2e/windows-native-runtime.mjs
      - name: Exercise the actual background executable's inherited Host channel
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        shell: pwsh
        run: |
          $version = (Get-Content clients/openmeld-cli/package.json | ConvertFrom-Json).version
          $env:OPENMELD_TEST_HOST_ARTIFACT = 'binary'
          $env:OPENMELD_TEST_HOST_BINARY = (Resolve-Path "cli/dist/openmeld-service-windows-x64-$version.exe").Path
          $env:OPENMELD_TEST_ARTIFACT_EVIDENCE = (Resolve-Path dev-tmp/windows-native-evidence).Path
          pnpm --dir clients/openmeld-cli exec vitest run --config vitest.integration.config.ts tests/service-execution-host-entry.integration.test.ts
      - name: Verify direct GUI tasks, running maintenance handoff, and stopped migration
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        shell: pwsh
        run: |
          $version = (Get-Content clients/openmeld-cli/package.json | ConvertFrom-Json).version
          $env:OPENMELD_TEST_HOST_BINARY = (Resolve-Path "cli/dist/openmeld-service-windows-x64-$version.exe").Path
          $env:OPENMELD_TEST_DIRECT_TASK_BINARY = (Resolve-Path "dev-tmp/windows-native-evidence/windows-direct-task.exe").Path
          pnpm --dir clients/openmeld-cli exec vitest run --config vitest.integration.config.ts tests/windows-direct-task.integration.test.ts
      - name: Preserve native acceptance evidence and exact unsigned artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dev-tmp/windows-native-evidence/
            cli/dist/*.exe
            cli/dist/*.pdb
          retention-days: 14
          if-no-files-found: error

      - name: Preserve the source-matched process helper for Mac development
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-process-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cli/dist/openmeld-windows-process.exe
            cli/dist/windows-process-artifact.json
          retention-days: 14
          if-no-files-found: error

  native-contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - name: Build the self-contained native process helper
        run: node scripts/release/build-windows-process-helper.mjs
      - name: Build the actual CLI and its Windows process contracts
        id: contracts-build
        run: pnpm exec turbo run build --filter=openmeld --concurrency=1
      - name: Install the packed CLI with clean npm and exercise its native SQLite reader
        run: node scripts/release/npm-cli-artifact.mjs
      - name: Exercise generated setup in Windows PowerShell 5.1
        run: pnpm --dir clients/web exec vitest run src/lib/setup-bootstrap-script.windows.test.ts src/lib/setup-bootstrap-script.windows-binary.test.ts --maxWorkers=1
      - name: Exercise native argv, Job ownership, SDK streams, and physical probe rejection
        run: node --test --test-concurrency=1 runtime/adapters/core/test/process-launch.test.js runtime/adapters/core/test/process-environment.test.js runtime/adapters/core/test/windows-system.test.js runtime/adapters/core/test/windows-process-job.test.js runtime/adapters/codex/test/workspace-access-probe.test.js runtime/adapters/claude-code/test/sdk-process.test.js
      - name: Verify Service identity and read-only capability admission
        run: pnpm --dir clients/openmeld-cli exec vitest run tests/process-identity.test.ts tests/service-control-capabilities.test.ts tests/windows-task-admission.test.ts tests/local-service-manager-command-match.test.ts tests/local-service-legacy-shared.test.ts --maxWorkers=1 --minWorkers=1
      - name: Verify console-free task hosting and stopped-task migration
        run: pnpm --dir clients/openmeld-cli exec vitest run tests/windows-task-host.native.test.ts --maxWorkers=1 --minWorkers=1
      - name: Verify Windows Desktop tool acquisition boundaries
        if: ${{ !cancelled() && steps.contracts-build.outcome == 'success' }}
        run: pnpm --dir clients/desktop exec vitest run tests/windows-command-environment.test.ts tests/managed-computer-tools.test.ts --maxWorkers=1 --minWorkers=1
      - name: Verify per-user package plans and Windows signing boundary
        if: ${{ !cancelled() && steps.contracts-build.outcome == 'success' }}
        run: node --test scripts/desktop/installed-platform.test.mjs scripts/desktop/windows-artifact.test.mjs scripts/release/desktop-preview.test.mjs
      - name: Verify updater configuration and native Authenticode
        if: ${{ !cancelled() && steps.contracts-build.outcome == 'success' }}
        run: pnpm --dir clients/desktop exec vitest run tests/windows-updater.test.ts tests/windows-signature.native.test.ts --maxWorkers=1 --minWorkers=1
      # Tests own disposable processes and uniquely named temporary registrations;
      # no production Service or provider login is used. Interactive task launch,
      # reboot, visual no-flash and real Codex sandbox remain user smoke.
