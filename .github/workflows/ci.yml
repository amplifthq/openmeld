name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  control-plane-image:
    name: Control Plane image smoke
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the release image
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: docker build --pull --platform linux/amd64 --build-arg "OPENTAG_RELEASE_SHA=$SOURCE_SHA" --file apps/control-plane/Dockerfile --tag opentag-control-plane:verified .
      - name: Verify container startup and restart
        run: node scripts/test/control-plane-image-smoke.mjs opentag-control-plane:verified
      - name: Audit image runtime dependencies
        run: docker run --rm --interactive --entrypoint node opentag-control-plane:verified --input-type=module < scripts/release/audit-control-plane-image.mjs
      - name: Save the exact tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save opentag-control-plane:verified --output control-plane-image.tar
      - name: Upload the exact tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: control-plane-image-${{ github.sha }}
          path: control-plane-image.tar
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  check:
    name: Build, lint, typecheck, test, and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: opentag_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opentag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENTAG_REQUIRE_TEST_DATABASE: "1"
      OPENTAG_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opentag_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Source App architecture boundaries
        run: pnpm check:source-apps

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Certify deterministic team relay profile
        run: pnpm test:team-relay

      - name: Typecheck the Compose smoke contract
        run: pnpm smoke:control-plane-compose:typecheck

      - name: Check publication set consistency
        run: pnpm release:publication-set

      - name: Check release packages
        run: pnpm release:check

  control-plane-e2e:
    name: Control Plane browser E2E
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir apps/control-plane exec playwright install --with-deps chromium

      - name: Run isolated Compose and browser E2E
        run: pnpm e2e:control-plane

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: control-plane-playwright
          path: |
            playwright-report/control-plane
            test-results/control-plane
          if-no-files-found: ignore
          retention-days: 7
