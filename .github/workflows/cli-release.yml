name: 📦 CLI Release
run-name: CLI Release @ ${{ inputs.release_sha || github.sha }}

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Optional exact commit to release or recover; leave empty for the dispatched main SHA"
        required: false
        type: string
        default: ""
      release_path:
        description: "Use normal unless recovering the same release after a completed stage"
        required: true
        type: choice
        default: normal
        options:
          - normal
          - resume-after-binary-upload
          - resume-after-npm-publish

concurrency:
  group: cli-production-release
  cancel-in-progress: false

jobs:
  reject_non_main:
    name: Reject Non-Main CLI Release
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          echo "::error::CLI releases must run from main. Current ref: ${GITHUB_REF}"
          exit 1

  cli_release:
    name: Publish CLI And Release Core
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    concurrency:
      group: deploy-core-worker-production
      cancel-in-progress: false
    environment: production
    env:
      RELEASE_PATH: ${{ inputs.release_path }}
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - name: Validate immutable release inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::CLI releases must run from main. Current ref: ${GITHUB_REF}"
            exit 1
          fi
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_sha must be an exact 40-character lowercase commit SHA."
            exit 1
          fi

      - name: Checkout current main history for source validation
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: release-control
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require release SHA from current main first-parent history
        shell: bash
        working-directory: release-control
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! validation_error="$(node scripts/release/require-mainline-release-sha.mjs \
            "$RELEASE_SHA" refs/remotes/origin/main 2>&1)"; then
            echo "::error::$validation_error"
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          path: release-source
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup repository toolchain
        uses: ./release-control/.github/actions/setup-node-pnpm
        with:
          control_directory: release-control
          working_directory: release-source

      - name: Acquire shared CLI publication lease
        id: cli_scope_lease
        uses: ./release-control/.github/actions/production-scope-lease
        with:
          github_token: ${{ github.token }}
          operation: acquire
          owner: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          scope: cli
          source_sha: ${{ env.RELEASE_SHA }}
          working_directory: release-source

      - name: Acquire shared Core projection lease
        id: core_scope_lease
        uses: ./release-control/.github/actions/production-scope-lease
        with:
          github_token: ${{ github.token }}
          operation: acquire
          owner: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          scope: core
          source_sha: ${{ env.RELEASE_SHA }}
          working_directory: release-source

      - name: Fetch release tags
        run: git fetch --tags --force
        working-directory: release-source

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup npm Trusted Publishing client
        run: |
          npm install --global npm@11.18.0
          npm --version

      - name: Build Core release dependencies
        run: pnpm turbo run build --filter=@openmeld/core...
        working-directory: release-source

      - name: Configure release tag identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        working-directory: release-source

      - name: Publish signed and notarized CLI, binary channel, npm package, tag, and Core
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # npm Trusted Publishing authenticates private repositories through OIDC,
          # but npm cannot write public Sigstore provenance for a private source repo.
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          set -euo pipefail
          case "$RELEASE_PATH" in
            normal|resume-after-binary-upload|resume-after-npm-publish)
              pnpm run release:cli --with-binary
              ;;
            *)
              echo "::error::Unknown release path: $RELEASE_PATH"
              exit 1
              ;;
          esac
        working-directory: release-source

      - name: Preserve a failed Core startup profile
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-startup-profile-${{ env.RELEASE_SHA }}
          if-no-files-found: ignore
          path: release-source/services/core/.wrangler/tmp/startup-profile-*/worker.cpuprofile
          retention-days: 14

      - name: Verify Core deployment is visible
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deployments list --config services/core/wrangler.jsonc --env prod --json > /dev/null
        working-directory: release-source

      - name: Release shared Core projection lease
        if: always() && steps.core_scope_lease.outputs.lease_sha != ''
        uses: ./release-control/.github/actions/production-scope-lease
        with:
          github_token: ${{ github.token }}
          lease_sha: ${{ steps.core_scope_lease.outputs.lease_sha }}
          operation: release
          scope: core
          working_directory: release-source

      - name: Release shared CLI publication lease
        if: always() && steps.cli_scope_lease.outputs.lease_sha != ''
        uses: ./release-control/.github/actions/production-scope-lease
        with:
          github_token: ${{ github.token }}
          lease_sha: ${{ steps.cli_scope_lease.outputs.lease_sha }}
          operation: release
          scope: cli
          working_directory: release-source
