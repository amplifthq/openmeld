name: 📦 CLI Release
run-name: CLI Release @ ${{ inputs.release_sha }}

# Dispatch this workflow directly to preserve the npm Trusted Publisher's
# cli-release.yml OIDC identity. Validate the SHA on main's first-parent history
# before building the Windows helper. The macOS job packages, signs, notarizes,
# and publishes with scripts/release/publish-cli.mjs. Installation checks run
# after publication.

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact 40-character commit on main's first-parent history"
        required: true
        type: string
      dry_run:
        description: "Validate the source and gates and print each step without publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release Source
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.source.outputs.release_sha }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys run release control from main. Current ref: ${GITHUB_REF}"
          exit 1

      - name: Checkout release control
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: release-control
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Refresh current main
        uses: ./release-control/.github/actions/trusted-git-network
        with:
          github_token: ${{ github.token }}
          operation: fetch-main
          repository: ${{ github.repository }}
          working_directory: release-control

      - name: Require the SHA on main first-parent history
        id: source
        working-directory: release-control
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          node scripts/release/require-mainline-release-sha.mjs "$RELEASE_SHA" refs/remotes/origin/main --github-output

  windows_helper:
    name: Build Windows Process Helper
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 20
    defaults: { run: { working-directory: release-source } }
    steps:
      - name: Checkout release control
        uses: actions/checkout@v5
        with: { fetch-depth: 0, path: release-control, persist-credentials: false, ref: "${{ github.sha }}" }
      - name: Prepare verified release source
        shell: bash
        working-directory: release-control
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: node scripts/release/prepare-release-source.mjs "$RELEASE_SHA"
      - name: Setup toolchain
        uses: ./release-control/.github/actions/setup-node-pnpm
        with: { working_directory: release-source, control_directory: release-control }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - run: node ../release-control/scripts/release/build-windows-process-helper.mjs
        env:
          OPENMELD_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
      - uses: actions/upload-artifact@v4
        with:
          name: windows-process-${{ needs.validate.outputs.release_sha }}
          path: |
            release-source/cli/dist/openmeld-windows-process.exe
            release-source/cli/dist/windows-process-artifact.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish CLI
    needs: [validate, windows_helper]
    runs-on: macos-15
    timeout-minutes: 45
    environment: production
    concurrency: { group: production-cli, cancel-in-progress: false, queue: max }
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
      DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
    defaults: { run: { working-directory: release-source } }
    steps:
      - name: Checkout release control
        uses: actions/checkout@v5
        with: { fetch-depth: 0, path: release-control, persist-credentials: false, ref: "${{ github.sha }}" }
      - name: Prepare verified release source
        shell: bash
        working-directory: release-control
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: node scripts/release/prepare-release-source.mjs "$RELEASE_SHA"
      - name: Use the Windows helper built for this source
        uses: actions/download-artifact@v4
        with:
          name: windows-process-${{ needs.validate.outputs.release_sha }}
          path: release-source/cli/dist
      - name: Setup toolchain
        if: inputs.dry_run != true
        uses: ./release-control/.github/actions/setup-node-pnpm
        with: { working_directory: release-source, control_directory: release-control }
      - name: Setup Bun
        if: inputs.dry_run != true
        uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Setup npm Trusted Publishing client
        if: inputs.dry_run != true
        run: npm install --global npm@11.18.0
      - name: Build, sign, publish, and check the release
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # npm Trusted Publishing authenticates this private repository with
          # OIDC but cannot write public provenance for it.
          NPM_CONFIG_PROVENANCE: "false"
        run: node ../release-control/scripts/release/deploy-component.mjs cli --sha "$RELEASE_SHA" $DRY_RUN

  npm_consumers:
    name: npm Install / Node ${{ matrix.node }} / ${{ matrix.os }}
    needs: [validate, publish]
    if: inputs.dry_run != true
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults: { run: { working-directory: release-source } }
    steps:
      - name: Checkout release control
        uses: actions/checkout@v5
        with: { fetch-depth: 0, path: release-control, persist-credentials: false, ref: "${{ github.sha }}" }
      - name: Prepare verified release source
        shell: bash
        working-directory: release-control
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: node scripts/release/prepare-release-source.mjs "$RELEASE_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install the published package on a clean machine
        shell: bash
        env:
          OPENMELD_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
        run: |
          set -euo pipefail
          version="$(node -p 'require("./clients/openmeld-cli/package.json").version')"
          npm pack "openmeld@${version}" --pack-destination "$RUNNER_TEMP"
          node ../release-control/scripts/release/npm-cli-smoke.mjs verify "$RUNNER_TEMP/openmeld-${version}.tgz"
          echo "OPENMELD_PACKAGE=$RUNNER_TEMP/openmeld-${version}.tgz" >> "$GITHUB_ENV"
      - name: Select Node 20 for the upgrade-message check
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/setup-node@v5
        with:
          node-version: "20.19.2"
          package-manager-cache: false
      - name: Reject Node 20 before loading dependencies
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          OPENMELD_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
        run: node ../release-control/scripts/release/npm-cli-smoke.mjs reject "$OPENMELD_PACKAGE"
