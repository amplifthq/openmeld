name: 🌐 Deploy Website
run-name: Deploy Website @ ${{ inputs.release_sha }}

permissions:
  contents: write
  actions: read
  checks: read
  statuses: read
  pull-requests: read

on:
  workflow_call:
    inputs:
      deploy_environment:
        description: "Deployment environment"
        required: false
        type: string
        default: production
      production_train_scopes:
        description: "Complete release train containing this Website stage"
        required: true
        type: string
      release_sha:
        description: "Exact main commit to deploy"
        required: true
        type: string
      parent_admission_evidence:
        description: "Same-run release-on-main admission output; omitted for standalone admission"
        required: false
        type: string
        default: ""
      parent_website_artifact_id:
        description: "Immutable Website snapshot artifact ID from the same parent job"
        required: false
        type: string
        default: ""

jobs:
  validate_release_source:
    name: Validate Immutable Main Release Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted current main validation code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: release-control
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Refresh current main with step-scoped read authentication
        uses: ./release-control/.github/actions/trusted-git-network
        with:
          github_token: ${{ github.token }}
          operation: fetch-main
          repository: ${{ github.repository }}
          working_directory: release-control

      - name: Require production target and main first-parent release SHA
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.deploy_environment }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        working-directory: release-control
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENVIRONMENT" != "production" ]; then
            echo "::error::Unsupported deploy environment. Only production is allowed."
            exit 1
          fi
          node scripts/release/require-mainline-release-sha.mjs \
            "$RELEASE_SHA" refs/remotes/origin/main

  deploy:
    name: 🌐 Deploy Website
    needs: validate_release_source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENMELD_PRODUCTION_TRAIN_SCOPES: ${{ inputs.production_train_scopes }}
      OPENMELD_PARENT_TRAIN_ADMISSION: ${{ inputs.parent_admission_evidence }}
      OPENMELD_PARENT_WEBSITE_ARTIFACT_ID: ${{ inputs.parent_website_artifact_id }}
      # The parent Website snapshot is built with this heap; input identity must
      # match before its verified bytes can be restored in this job.
      OPENMELD_RENDERER_NODE_HEAP_MB: ${{ inputs.parent_admission_evidence != '' && '5120' || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    concurrency:
      group: deploy-website-production
      queue: max
      cancel-in-progress: false
    environment: production
    defaults:
      run:
        working-directory: release-source
    steps:
      - name: Checkout trusted release control
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          path: release-control
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Setup repository toolchain
        uses: ./release-control/.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.parent_admission_evidence && fromJSON(inputs.parent_admission_evidence).buildInputs.node || '24' }}
          control_directory: release-control
          working_directory: release-source

      - name: Admit declared production train artifacts
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          node ../release-control/scripts/release/production-train-artifact-admission.mjs \
            --source-sha "$RELEASE_SHA" \
            --scope website

      - name: Download the admitted Website snapshot from this run
        if: inputs.parent_admission_evidence != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.parent_website_artifact_id }}
          merge-multiple: true
          path: release-source/dev-tmp/release-artifact-check

      - name: Verify and restore the admitted Website bytes
        if: inputs.parent_admission_evidence != ''
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          node ../release-control/scripts/release/production-train-artifact-admission.mjs \
            --source-sha "$RELEASE_SHA" \
            --scope website \
            --restore-renderer-artifact

      - name: Acquire shared Website release lease
        id: scope_lease
        uses: ./release-control/.github/actions/production-scope-lease
        with:
          github_token: ${{ github.token }}
          operation: acquire
          owner: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          scope: website
          source_sha: ${{ inputs.release_sha }}
          working_directory: release-source

      - name: Run Website deployment preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          node ../release-control/scripts/release/hosted-production-preflight.mjs \
            --release-source "$PWD" \
            --release-sha "$RELEASE_SHA" \
            --scope website

      - name: Deploy Website
        run: pnpm -C clients/website run sync:config:prod

      - name: Verify Website health
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: node ../release-control/scripts/release/production-web-health.mjs --scope website --url https://openmeld.ai --source-sha "$RELEASE_SHA" --artifact-receipt dev-tmp/release-artifact-check/website.json

      - name: Retain private browser source maps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-source-maps-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-source/clients/website/dist/client/_website/assets/**/*.map
          if-no-files-found: ignore
          retention-days: 14

      - name: Release shared Website release lease
        if: always() && steps.scope_lease.outputs.lease_sha != ''
        uses: ./release-control/.github/actions/production-scope-lease
        with:
          github_token: ${{ github.token }}
          lease_sha: ${{ steps.scope_lease.outputs.lease_sha }}
          operation: release
          scope: website
          working_directory: release-source
