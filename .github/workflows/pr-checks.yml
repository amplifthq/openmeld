name: Fast PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Fast PR / Plan
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_remaining_tests: ${{ steps.unit-test-plan.outputs.has_remaining_tests }}
      has_shards: ${{ steps.unit-test-plan.outputs.has_shards }}
      shards: ${{ steps.unit-test-plan.outputs.shards }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup planning toolchain
        uses: ./.github/actions/setup-fast-pr-plan

      - name: Plan affected unit tests
        id: unit-test-plan
        env:
          OPENMELD_AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}
          OPENMELD_TURBO_DLX_PACKAGE: turbo@2.9.6
        run: |
          node scripts/dev/turbo-affected.mjs --changed-only test -- --dry=json > "$RUNNER_TEMP/fast-pr-test-plan.json"
          node scripts/ci/fast-pr-test-plan.mjs "$RUNNER_TEMP/fast-pr-test-plan.json"

  static:
    name: Fast PR / Static
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Check dependency rules
        run: pnpm sherif

      - name: Check Cloudflare Worker env contract
        run: pnpm run verify:cloudflare:env-contract

      - name: Check Doppler development environment contract
        run: pnpm run verify:doppler-environment

      - name: Check retired identifiers
        run: bash scripts/ci/check-retired-identifiers.sh

      - name: Check developer documentation lifecycle
        run: pnpm run verify:docs -- --strict

      - name: Check Changelog contract and projections
        run: pnpm run verify:changelog

      - name: Check CI and release workflow contracts
        run: pnpm run verify:release-workflows

      - name: Resolve release verification mode
        id: release-mode
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/release/release-branch-policy.mjs "$PR_HEAD_REF" "$PR_BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify release-ready local components for a release PR
        if: steps.release-mode.outputs.mode == 'strict'
        run: pnpm run verify:release-ready

      - name: Verify deferred local components for a feature PR
        if: steps.release-mode.outputs.mode == 'deferred'
        run: pnpm run verify:release-ready -- --defer-release --base ${{ github.event.pull_request.base.sha }}

  check:
    name: Fast PR / Checks
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Restore Fast PR Turbo cache
        uses: ./.github/actions/cache-fast-pr-turbo
        with:
          cache-suffix: checks

      - name: Check changed workspaces
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENMELD_AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/dev/turbo-affected.mjs --changed-only check -- --concurrency=2 --output-logs=errors-only

  unit-test-shards:
    name: Fast PR / Unit Tests / ${{ matrix.name }}
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.has_shards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards || '[]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Restore Fast PR Turbo cache
        if: matrix.requiresDependencyBuild
        uses: ./.github/actions/cache-fast-pr-turbo
        with:
          cache-suffix: unit-${{ matrix.cacheKey }}

      - name: Build test dependencies
        if: matrix.requiresDependencyBuild
        run: pnpm exec turbo run build --filter=${{ matrix.package }}^... --output-logs=errors-only

      - name: Run ${{ matrix.name }}
        run: pnpm --filter ${{ matrix.package }} exec vitest run --config ${{ matrix.config }} --shard=${{ matrix.shard }} --reporter=dot --silent=passed-only

  remaining-unit-tests:
    name: Fast PR / Unit Tests / Remaining
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.has_remaining_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Restore Fast PR Turbo cache
        uses: ./.github/actions/cache-fast-pr-turbo
        with:
          cache-suffix: remaining-unit-tests

      - name: Test remaining changed workspaces
        env:
          OPENMELD_AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/dev/turbo-affected.mjs --changed-only --exclude-package=openmeld-web --exclude-package=openmeld --exclude-package=@openmeld/core test -- --concurrency=1 --output-logs=errors-only

  gate:
    name: Fast PR
    if: always() && github.event.pull_request.draft == false
    needs: [plan, static, check, unit-test-shards, remaining-unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required jobs passed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          REMAINING_TESTS_RESULT: ${{ needs.remaining-unit-tests.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_TEST_SHARDS_RESULT: ${{ needs.unit-test-shards.result }}
        run: |
          if [[ "$PLAN_RESULT" != "success" || "$STATIC_RESULT" != "success" || "$CHECK_RESULT" != "success" ]]; then
            echo "Fast PR failed: plan=$PLAN_RESULT, static=$STATIC_RESULT, checks=$CHECK_RESULT"
            exit 1
          fi
          if [[ "$UNIT_TEST_SHARDS_RESULT" != "success" && "$UNIT_TEST_SHARDS_RESULT" != "skipped" ]]; then
            echo "Fast PR failed: unit-test-shards=$UNIT_TEST_SHARDS_RESULT"
            exit 1
          fi
          if [[ "$REMAINING_TESTS_RESULT" != "success" && "$REMAINING_TESTS_RESULT" != "skipped" ]]; then
            echo "Fast PR failed: remaining-unit-tests=$REMAINING_TESTS_RESULT"
            exit 1
          fi
