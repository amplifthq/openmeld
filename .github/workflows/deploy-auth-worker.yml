name: 🛡️ Deploy Auth Worker
run-name: Deploy Auth Worker @ ${{ inputs.release_sha || github.sha }}

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: production
        options:
          - production
      release_sha:
        description: "Optional exact main commit to deploy"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      deploy_environment:
        description: "Deployment environment"
        required: false
        type: string
        default: production
      release_sha:
        description: "Exact main commit to deploy"
        required: false
        type: string
        default: ""

jobs:
  deploy:
    name: 🛡️ Deploy Auth Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-auth-worker-production
      cancel-in-progress: false
    environment: production
    env:
      BETTER_AUTH_OPENMELD_SECRET: ci_codegen_only_secret_please_do_not_use_1234567890
      AUTH_WORKER_NODE_ENV: development
      BETTER_AUTH_URL: http://localhost:8788
      WEB_APP_URL: http://localhost:8788
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.deploy_environment || 'production' }}" != "production" ]; then
            echo "::error::Unsupported deploy environment. Only production is allowed."
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production deploys must run from main. Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Acquire shared Auth release lease
        id: scope_lease
        uses: ./.github/actions/production-scope-lease
        with:
          operation: acquire
          owner: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          scope: auth
          source_sha: ${{ inputs.release_sha || github.sha }}

      - name: Run Auth Worker deployment preflight
        run: pnpm run release:preflight:local -- --scope auth --base HEAD

      - name: Capture Auth bundle evidence
        run: pnpm run evidence:bundle:auth

      - name: Deploy Auth Worker
        run: pnpm -C services/auth run sync:config:prod

      - name: Verify Auth Worker health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 https://auth.openmeld.ai/health > /dev/null

      - name: Preserve Auth bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-bundle-evidence-${{ inputs.release_sha || github.sha }}
          if-no-files-found: warn
          path: dev-tmp/auth-bundle-evidence.json
          retention-days: 30

      - name: Release shared Auth release lease
        if: always() && steps.scope_lease.outputs.lease_sha != ''
        uses: ./.github/actions/production-scope-lease
        with:
          lease_sha: ${{ steps.scope_lease.outputs.lease_sha }}
          operation: release
          scope: auth
