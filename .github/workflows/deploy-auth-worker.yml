name: 🛡️ Deploy Auth Worker
run-name: Deploy Auth Worker @ ${{ inputs.release_sha }}

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      deploy_environment:
        description: "Deployment environment"
        required: false
        type: string
        default: production
      release_sha:
        description: "Exact main commit to deploy"
        required: true
        type: string

jobs:
  validate_release_source:
    name: Validate Immutable Main Release Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted current main validation code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Require production target and main first-parent release SHA
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.deploy_environment }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENVIRONMENT" != "production" ]; then
            echo "::error::Unsupported deploy environment. Only production is allowed."
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          node scripts/release/require-mainline-release-sha.mjs \
            "$RELEASE_SHA" refs/remotes/origin/main

  deploy:
    name: 🛡️ Deploy Auth Worker
    needs: validate_release_source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-auth-worker-production
      cancel-in-progress: false
    environment: production
    env:
      BETTER_AUTH_OPENMELD_SECRET: ci_codegen_only_secret_please_do_not_use_1234567890
      AUTH_WORKER_NODE_ENV: development
      BETTER_AUTH_URL: http://localhost:8788
      WEB_APP_URL: http://localhost:8788
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          ref: ${{ inputs.release_sha }}

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Acquire shared Auth release lease
        id: scope_lease
        uses: ./.github/actions/production-scope-lease
        with:
          operation: acquire
          owner: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          scope: auth
          source_sha: ${{ inputs.release_sha }}

      - name: Run Auth Worker deployment preflight
        run: pnpm run release:preflight:local -- --scope auth --base HEAD

      - name: Capture Auth bundle evidence
        run: pnpm run evidence:bundle:auth

      - name: Deploy Auth Worker
        run: pnpm -C services/auth run sync:config:prod

      - name: Verify Auth Worker health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 https://auth.openmeld.ai/health > /dev/null

      - name: Preserve Auth bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-bundle-evidence-${{ inputs.release_sha }}
          if-no-files-found: warn
          path: dev-tmp/auth-bundle-evidence.json
          retention-days: 30

      - name: Release shared Auth release lease
        if: always() && steps.scope_lease.outputs.lease_sha != ''
        uses: ./.github/actions/production-scope-lease
        with:
          lease_sha: ${{ steps.scope_lease.outputs.lease_sha }}
          operation: release
          scope: auth
